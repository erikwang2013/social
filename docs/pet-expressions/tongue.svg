@keyframes ex-pulse { 0%,100% { transform: scale(1); opacity: .35; } 50% { transform: scale(1.18); opacity: .7; } }
@keyframes ex-knock { 0%,100% { transform: translateX(7.65px); } 35% { transform: translateX(0); } }
@keyframes ex-knockline { 0%,100% { transform: scaleX(.6); opacity: .35; } 35% { transform: scaleX(1); opacity: 1; } }
@keyframes ex-palm { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-2.04px) rotate(-4deg); } }
@keyframes ex-steam { 0% { transform: translateY(0); opacity: .7; } 100% { transform: translateY(-15.3px); opacity: 0; } }
@keyframes ex-shock { 0%,100% { transform: scaleX(.7); opacity: .4; } 50% { transform: scaleX(1.25); opacity: 1; } }
@keyframes ex-please { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3.06px); } }
@keyframes ex-drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3.4px); } }
@media (prefers-reduced-motion: reduce) {
  .ex-motion, [class*="ex-anim-"] { animation: none !important; }
}
