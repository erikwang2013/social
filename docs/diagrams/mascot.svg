<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" role="img" aria-labelledby="mascotTitle">
  <title id="mascotTitle">Geist — Social Platform 项目宠物（戴耳机的信鸽）</title>
  <style>
    .body  { fill: #2563eb; stroke: #0f172a; stroke-width: 5 }
    .head  { fill: #2563eb; stroke: #0f172a; stroke-width: 5 }
    .beak  { fill: #dbeafe; stroke: #0f172a; stroke-width: 4; stroke-linejoin: round }
    .eye   { fill: #ffffff; stroke: #0f172a; stroke-width: 3 }
    .pupil { fill: #0f172a }
    .band  { fill: none; stroke: #0f172a; stroke-width: 11; stroke-linecap: round }
    .cup   { fill: #0f172a }
    .pad   { fill: #16a34a }
    .wave  { fill: #16a34a }
  </style>

  <g transform="translate(0,-8)">
    <!-- 身体 -->
    <ellipse class="body" cx="120" cy="160" rx="52" ry="56"/>
    <!-- 胸前声波：三根音柱 -->
    <g class="wave">
      <rect x="106" y="170" width="7" height="16" rx="3.5"/>
      <rect x="116" y="161" width="7" height="34" rx="3.5"/>
      <rect x="126" y="170" width="7" height="16" rx="3.5"/>
    </g>
    <!-- 头 -->
    <circle class="head" cx="120" cy="88" r="44"/>
    <!-- 喙 -->
    <path class="beak" d="M 109 100 L 131 100 L 120 118 Z"/>
    <!-- 眼 -->
    <circle class="eye" cx="104" cy="74" r="8"/>
    <circle class="eye" cx="136" cy="74" r="8"/>
    <circle class="pupil" cx="104" cy="75" r="3.4"/>
    <circle class="pupil" cx="136" cy="75" r="3.4"/>
    <!-- 耳机 -->
    <path class="band" d="M 80 72 C 80 28 160 28 160 72"/>
    <rect class="cup" x="66" y="68" width="28" height="40" rx="14"/>
    <rect class="cup" x="146" y="68" width="28" height="40" rx="14"/>
    <ellipse class="pad" cx="80" cy="88" rx="5.5" ry="8.5"/>
    <ellipse class="pad" cx="160" cy="88" rx="5.5" ry="8.5"/>
  </g>
</svg>
