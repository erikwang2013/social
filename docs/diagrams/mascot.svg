<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" role="img" aria-labelledby="mascotTitle">
  <title id="mascotTitle">Bub — Social Platform 项目宠物（消息气泡）</title>
  <style>
    .body { fill: #2563eb; stroke: #0f172a; stroke-width: 6; stroke-linejoin: round }
    .arm  { fill: #2563eb; stroke: #0f172a; stroke-width: 5; stroke-linejoin: round }
    .ink  { fill: #0f172a }
    .eye  { fill: #ffffff }
    .pupil{ fill: #0f172a }
    .blush{ fill: #fda4af }
    .mouth{ fill: none; stroke: #0f172a; stroke-width: 4; stroke-linecap: round }
  </style>

  <g transform="rotate(-5 120 130)">
    <!-- 手臂：压在气泡后 -->
    <path class="arm" d="M 58 114 C 36 108 20 118 22 132 C 24 145 44 146 58 136 Z"/>
    <path class="arm" d="M 182 114 C 204 108 220 118 218 132 C 216 145 196 146 182 136 Z"/>

    <!-- 气泡：本体就是一条消息，左下尾巴兼作脚 -->
    <path class="body" d="M 96 56 L 144 56 C 173 56 194 77 194 106 L 194 128 C 194 157 173 178 144 178 L 118 178 L 76 212 C 70 217 60 213 62 204 L 70 178 C 55 172 46 155 46 132 L 46 106 C 46 77 67 56 96 56 Z"/>

    <!-- 面部 -->
    <circle class="eye" cx="97" cy="104" r="17"/>
    <circle class="eye" cx="145" cy="104" r="17"/>
    <circle class="pupil" cx="97" cy="107" r="9"/>
    <circle class="eye" cx="94" cy="103" r="3.4"/>
    <circle class="pupil" cx="145" cy="107" r="9"/>
    <circle class="eye" cx="142" cy="103" r="3.4"/>
    <ellipse class="blush" cx="72" cy="136" rx="12" ry="7.5"/>
    <ellipse class="blush" cx="170" cy="136" rx="12" ry="7.5"/>
    <path class="mouth" d="M 108 132 C 113 141 129 141 134 132"/>
  </g>
</svg>
