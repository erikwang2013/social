<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 856" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .mod  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; rx: 10 }
    .it   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6 }
    .tm   { font-size: 14px; font-weight: 700; fill: #1e3a8a; text-anchor: middle }
    .t    { font-size: 11.5px; fill: #0f172a; text-anchor: middle }
  </style>

  <!-- 接入层 -->
  <rect class="mod" x="20" y="20" width="920" height="86"/>
  <text class="tm" x="480" y="44">الوصول · service/config/process.php (Http + WsServer)</text>
  <rect class="it" x="40" y="56" width="440" height="38"/>
  <text class="t" x="260" y="70">HTTP :8788 · X-Api-Version قبل التوجيه</text>
  <text class="t" x="260" y="84" font-size="10" fill="#64748b">v1 افتراضي · تحقق v\d+ · /api/vX (Http.php)</text>
  <rect class="it" x="500" y="56" width="420" height="38"/>
  <text class="t" x="710" y="70">WS :8789 · إطارات Envelope</text>
  <text class="t" x="710" y="84" font-size="10" fill="#64748b">توزيع ActionHandler · ConnectionRegistry uid→fd</text>

  <!-- IM 模块 -->
  <rect class="mod" x="20" y="126" width="440" height="150"/>
  <text class="tm" x="240" y="150">وحدة IM · app/ws + app/im</text>
  <rect class="it" x="40" y="162" width="400" height="30"/>
  <text class="t" x="240" y="181">Deliverer · حالة WsRedis</text>
  <rect class="it" x="40" y="198" width="400" height="30"/>
  <text class="t" x="240" y="217">محادثة 1v1 / نص / صوت (type=3)</text>
  <rect class="it" x="40" y="234" width="400" height="30"/>
  <text class="t" x="240" y="253">رفع صوت → gRPC Rust VoiceStorage (m4a)</text>

  <!-- 通话模块 -->
  <rect class="mod" x="480" y="126" width="460" height="150"/>
  <text class="tm" x="710" y="150">مكالمة 1v1 · Rust bee_live (HTTP عبر gRPC · WS عبر PHP)</text>
  <rect class="it" x="500" y="162" width="420" height="30"/>
  <text class="t" x="710" y="181">Redis im:call:{id} حالة (HSET)</text>
  <rect class="it" x="500" y="198" width="420" height="30"/>
  <text class="t" x="710" y="217">im:callbusy مشغول (SETNX TTL 300)</text>
  <rect class="it" x="500" y="234" width="420" height="30"/>
  <text class="t" x="710" y="253">مهلة 30 ث · بوابة finish (NX+EX 3600)</text>

  <!-- 语聊房模块 -->
  <rect class="mod" x="20" y="296" width="440" height="150"/>
  <text class="tm" x="240" y="320">غرفة صوتية · Rust bee_live (HTTP عبر gRPC · WS عبر PHP)</text>
  <rect class="it" x="40" y="332" width="400" height="30"/>
  <text class="t" x="240" y="351">DB rooms/room_members حقائق · Redis متصل</text>
  <rect class="it" x="40" y="368" width="400" height="30"/>
  <text class="t" x="240" y="387">8 مقاعد · TOCTOU · بث close</text>
  <rect class="it" x="40" y="404" width="400" height="30"/>
  <text class="t" x="240" y="423">sfuRelay ترجمة · HTTP → SFU</text>

  <!-- SFU 模块 -->
  <rect class="mod" x="480" y="296" width="460" height="150"/>
  <text class="tm" x="710" y="320">وسائط · media/sfu/server.js (mediasoup 3.14)</text>
  <rect class="it" x="500" y="332" width="420" height="30"/>
  <text class="t" x="710" y="351">Router لكل غرفة · transports/producers/consumers</text>
  <rect class="it" x="500" y="368" width="420" height="30"/>
  <text class="t" x="710" y="387">RTC UDP 10000-10200 · 5 دقائق</text>
  <rect class="it" x="500" y="404" width="420" height="30"/>
  <text class="t" x="710" y="423">coturn TURN :3478 · حد 64KB</text>

  <!-- 直播模块 -->
  <rect class="mod" x="20" y="466" width="440" height="150"/>
  <text class="tm" x="240" y="490">وحدة البث · Rust bee_live (HTTP عبر gRPC · WS عبر PHP)</text>
  <rect class="it" x="40" y="502" width="400" height="30"/>
  <text class="t" x="240" y="521">حالة الغرفة/البث (MySQL حقائق)</text>
  <rect class="it" x="40" y="538" width="400" height="30"/>
  <text class="t" x="240" y="557">قناة بث WS (live:{room}:online)</text>
  <rect class="it" x="40" y="574" width="400" height="30"/>
  <text class="t" x="240" y="593">مؤثرات الهدايا live_gift بنفس القناة</text>

  <!-- 虚拟经济 -->
  <rect class="mod" x="480" y="466" width="460" height="186"/>
  <text class="tm" x="710" y="490">الاقتصاد الافتراضي · app/common (PHP)</text>
  <rect class="it" x="500" y="502" width="420" height="30"/>
  <text class="t" x="710" y="521">محفظة رصيد/سجل (MySQL المصدر الوحيد)</text>
  <rect class="it" x="500" y="538" width="420" height="30"/>
  <text class="t" x="710" y="557">هدية خصم/تقسيم (client_ref تكرار-آمن)</text>
  <rect class="it" x="500" y="574" width="420" height="30"/>
  <text class="t" x="710" y="593">شحن IAP تحقق ثلاثي إيداع تكرار-آمن</text>
  <rect class="it" x="500" y="610" width="420" height="30"/>
  <text class="t" x="710" y="629">قنوات الدفع WeChat/Alipay/Stripe تحقق من رد الاتصال</text>

  <!-- 数据与状态 -->
  <rect class="mod" x="20" y="672" width="920" height="76"/>
  <text class="tm" x="480" y="696">تصميم الحالة والاتساق</text>
  <rect class="it" x="40" y="708" width="290" height="30"/>
  <text class="t" x="185" y="727">MySQL: حقائق (مستخدمون/منشورات/غرف)</text>
  <rect class="it" x="350" y="708" width="290" height="30"/>
  <text class="t" x="495" y="727">Redis: جلسة / IM / مكالمة / غرفة</text>
  <rect class="it" x="660" y="708" width="260" height="30"/>
  <text class="t" x="790" y="727">بث REST no-op (معروف)</text>
  <!-- CDN 存储模块 -->
  <rect class="mod" x="20" y="768" width="920" height="76"/>
  <text class="tm" x="480" y="792">تخزين CDN · app/common/Storage + لوحة الإدارة (متوافق مع S3)</text>
  <rect class="it" x="40" y="804" width="290" height="30"/>
  <text class="t" x="185" y="823">رفع → تحقق PHP + علامة مائية</text>
  <rect class="it" x="350" y="804" width="290" height="30"/>
  <text class="t" x="495" y="823">تخزين الكائنات (S3/R2/OSS/COS/B2)</text>
  <rect class="it" x="660" y="804" width="260" height="30"/>
  <text class="t" x="790" y="823">توزيع CDN الطرفي · قابل للتهيئة من لوحة الإدارة</text>
</svg>
