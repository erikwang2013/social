<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .mod  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; rx: 10 }
    .it   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6 }
    .tm   { font-size: 14px; font-weight: 700; fill: #1e3a8a; text-anchor: middle }
    .t    { font-size: 11.5px; fill: #0f172a; text-anchor: middle }
  </style>

  <!-- 接入层 -->
  <rect class="mod" x="20" y="20" width="920" height="86"/>
  <text class="tm" x="480" y="44">Acceso · service/config/process.php (Http + WsServer)</text>
  <rect class="it" x="40" y="56" width="440" height="38"/>
  <text class="t" x="260" y="70">HTTP :8788 · X-Api-Version antes de rutear</text>
  <text class="t" x="260" y="84" font-size="10" fill="#64748b">v1 por defecto · validar v\d+ · /api/vX (Http.php)</text>
  <rect class="it" x="500" y="56" width="420" height="38"/>
  <text class="t" x="710" y="70">WS :8789 · frames Envelope</text>
  <text class="t" x="710" y="84" font-size="10" fill="#64748b">Dispatch ActionHandler · ConnectionRegistry uid→fd</text>

  <!-- IM 模块 -->
  <rect class="mod" x="20" y="126" width="440" height="150"/>
  <text class="tm" x="240" y="150">Módulo IM · app/ws + app/im</text>
  <rect class="it" x="40" y="162" width="400" height="30"/>
  <text class="t" x="240" y="181">Entrega Deliverer · estado WsRedis</text>
  <rect class="it" x="40" y="198" width="400" height="30"/>
  <text class="t" x="240" y="217">Chat 1v1 / texto / voz (type=3)</text>
  <rect class="it" x="40" y="234" width="400" height="30"/>
  <text class="t" x="240" y="253">Subir voz → gRPC Rust VoiceStorage (m4a)</text>

  <!-- 通话模块 -->
  <rect class="mod" x="480" y="126" width="460" height="150"/>
  <text class="tm" x="710" y="150">Llamada 1v1 · Rust bee_live (HTTP vía gRPC · WS vía PHP)</text>
  <rect class="it" x="500" y="162" width="420" height="30"/>
  <text class="t" x="710" y="181">Redis im:call:{id} máq. de estados (HSET)</text>
  <rect class="it" x="500" y="198" width="420" height="30"/>
  <text class="t" x="710" y="217">im:callbusy ocupado (SETNX TTL 300)</text>
  <rect class="it" x="500" y="234" width="420" height="30"/>
  <text class="t" x="710" y="253">Timeout 30s · compuerta única finish (NX+EX 3600)</text>

  <!-- 语聊房模块 -->
  <rect class="mod" x="20" y="296" width="440" height="150"/>
  <text class="tm" x="240" y="320">Sala de voz · Rust bee_live (HTTP vía gRPC · WS vía PHP)</text>
  <rect class="it" x="40" y="332" width="400" height="30"/>
  <text class="t" x="240" y="351">DB rooms/room_members hechos · Redis en línea</text>
  <rect class="it" x="40" y="368" width="400" height="30"/>
  <text class="t" x="240" y="387">8 asientos · rever TOCTOU · broadcast close</text>
  <rect class="it" x="40" y="404" width="400" height="30"/>
  <text class="t" x="240" y="423">sfuRelay traducción · HTTP → SFU</text>

  <!-- SFU 模块 -->
  <rect class="mod" x="480" y="296" width="460" height="150"/>
  <text class="tm" x="710" y="320">Medios · media/sfu/server.js (mediasoup 3.14)</text>
  <rect class="it" x="500" y="332" width="420" height="30"/>
  <text class="t" x="710" y="351">Un Router por sala · transports/producers/consumers</text>
  <rect class="it" x="500" y="368" width="420" height="30"/>
  <text class="t" x="710" y="387">RTC UDP 10000-10200 · reciclaje 5min</text>
  <rect class="it" x="500" y="404" width="420" height="30"/>
  <text class="t" x="710" y="423">coturn TURN :3478 · límite 64KB</text>

  <!-- 直播模块 -->
  <rect class="mod" x="20" y="466" width="440" height="150"/>
  <text class="tm" x="240" y="490">Módulo en vivo · Rust bee_live (HTTP vía gRPC · WS vía PHP)</text>
  <rect class="it" x="40" y="502" width="400" height="30"/>
  <text class="t" x="240" y="521">Máquina de estados sala/stream (MySQL hechos)</text>
  <rect class="it" x="40" y="538" width="400" height="30"/>
  <text class="t" x="240" y="557">Canal broadcast WS (live:{room}:online)</text>
  <rect class="it" x="40" y="574" width="400" height="30"/>
  <text class="t" x="240" y="593">Efectos de regalos live_gift mismo canal</text>

  <!-- 虚拟经济 -->
  <rect class="mod" x="480" y="466" width="460" height="150"/>
  <text class="tm" x="710" y="490">Economía virtual · app/common (PHP)</text>
  <rect class="it" x="500" y="502" width="420" height="30"/>
  <text class="t" x="710" y="521">Cartera saldo/registro (MySQL única fuente)</text>
  <rect class="it" x="500" y="538" width="420" height="30"/>
  <text class="t" x="710" y="557">Regalo débito/reparto (client_ref idempotente)</text>
  <rect class="it" x="500" y="574" width="420" height="30"/>
  <text class="t" x="710" y="593">Recarga IAP verif. 3 vías idempotente</text>

  <!-- 数据与状态 -->
  <rect class="mod" x="20" y="636" width="920" height="76"/>
  <text class="tm" x="480" y="660">Diseño de estado y consistencia</text>
  <rect class="it" x="40" y="672" width="290" height="30"/>
  <text class="t" x="185" y="691">MySQL: hechos (usuarios/posts/salas)</text>
  <rect class="it" x="350" y="672" width="290" height="30"/>
  <text class="t" x="495" y="691">Redis: sesión / IM / llamada / sala</text>
  <rect class="it" x="660" y="672" width="260" height="30"/>
  <text class="t" x="790" y="691">Broadcast REST no-op (conocido)</text>
</svg>
