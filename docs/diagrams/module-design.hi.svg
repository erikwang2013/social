<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .mod  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; rx: 10 }
    .it   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6 }
    .tm   { font-size: 14px; font-weight: 700; fill: #1e3a8a; text-anchor: middle }
    .t    { font-size: 11.5px; fill: #0f172a; text-anchor: middle }
  </style>

  <!-- 接入层 -->
  <rect class="mod" x="20" y="20" width="920" height="86"/>
  <text class="tm" x="480" y="44">एक्सेस · service/config/process.php (Http + WsServer)</text>
  <rect class="it" x="40" y="56" width="440" height="38"/>
  <text class="t" x="260" y="70">HTTP :8788 · X-Api-Version पहले</text>
  <text class="t" x="260" y="84" font-size="10" fill="#64748b">डिफ़ॉल्ट v1 · v\d+ · /api/vX (Http.php)</text>
  <rect class="it" x="500" y="56" width="420" height="38"/>
  <text class="t" x="710" y="70">WS :8789 · Envelope फ्रेम</text>
  <text class="t" x="710" y="84" font-size="10" fill="#64748b">ActionHandler डिस्पैच · ConnectionRegistry uid→fd</text>

  <!-- IM 模块 -->
  <rect class="mod" x="20" y="126" width="440" height="150"/>
  <text class="tm" x="240" y="150">IM मॉड्यूल · app/ws + app/im</text>
  <rect class="it" x="40" y="162" width="400" height="30"/>
  <text class="t" x="240" y="181">Deliverer · WsRedis सत्र</text>
  <rect class="it" x="40" y="198" width="400" height="30"/>
  <text class="t" x="240" y="217">1v1 चैट / टेक्स्ट / वॉइस (type=3)</text>
  <rect class="it" x="40" y="234" width="400" height="30"/>
  <text class="t" x="240" y="253">वॉइस अपलोड → gRPC Rust VoiceStorage (m4a)</text>

  <!-- 通话模块 -->
  <rect class="mod" x="480" y="126" width="460" height="150"/>
  <text class="tm" x="710" y="150">1v1 कॉल · Rust bee_live (HTTP via gRPC · WS via PHP)</text>
  <rect class="it" x="500" y="162" width="420" height="30"/>
  <text class="t" x="710" y="181">Redis im:call:{id} स्टेट (HSET)</text>
  <rect class="it" x="500" y="198" width="420" height="30"/>
  <text class="t" x="710" y="217">im:callbusy व्यस्त (SETNX TTL 300)</text>
  <rect class="it" x="500" y="234" width="420" height="30"/>
  <text class="t" x="710" y="253">30 सेकंड टाइमआउट · finish गेट (NX+EX 3600)</text>

  <!-- 语聊房模块 -->
  <rect class="mod" x="20" y="296" width="440" height="150"/>
  <text class="tm" x="240" y="320">वॉइस रूम · Rust bee_live (HTTP via gRPC · WS via PHP)</text>
  <rect class="it" x="40" y="332" width="400" height="30"/>
  <text class="t" x="240" y="351">DB rooms/room_members तथ्य · Redis ऑनलाइन</text>
  <rect class="it" x="40" y="368" width="400" height="30"/>
  <text class="t" x="240" y="387">8 सीटें · TOCTOU · close प्रसारण</text>
  <rect class="it" x="40" y="404" width="400" height="30"/>
  <text class="t" x="240" y="423">sfuRelay अनुवाद · HTTP → SFU</text>

  <!-- SFU 模块 -->
  <rect class="mod" x="480" y="296" width="460" height="150"/>
  <text class="tm" x="710" y="320">मीडिया · media/sfu/server.js (mediasoup 3.14)</text>
  <rect class="it" x="500" y="332" width="420" height="30"/>
  <text class="t" x="710" y="351">हर रूम में Router · transports/producers/consumers</text>
  <rect class="it" x="500" y="368" width="420" height="30"/>
  <text class="t" x="710" y="387">RTC UDP 10000-10200 · 5 मिनट</text>
  <rect class="it" x="500" y="404" width="420" height="30"/>
  <text class="t" x="710" y="423">coturn TURN :3478 · 64KB सीमा</text>

  <!-- 直播模块 -->
  <rect class="mod" x="20" y="466" width="440" height="150"/>
  <text class="tm" x="240" y="490">लाइव मॉड्यूल · Rust bee_live (HTTP via gRPC · WS via PHP)</text>
  <rect class="it" x="40" y="502" width="400" height="30"/>
  <text class="t" x="240" y="521">रूम/स्ट्रीम स्टेट मशीन (MySQL तथ्य)</text>
  <rect class="it" x="40" y="538" width="400" height="30"/>
  <text class="t" x="240" y="557">WS प्रसारण चैनल (live:{room}:online)</text>
  <rect class="it" x="40" y="574" width="400" height="30"/>
  <text class="t" x="240" y="593">गिफ्ट इफेक्ट live_gift उसी चैनल पर</text>

  <!-- 虚拟经济 -->
  <rect class="mod" x="480" y="466" width="460" height="150"/>
  <text class="tm" x="710" y="490">वर्चुअल अर्थव्यवस्था · app/common (PHP)</text>
  <rect class="it" x="500" y="502" width="420" height="30"/>
  <text class="t" x="710" y="521">वॉलेट बैलेंस/लेजर (MySQL एकमात्र स्रोत)</text>
  <rect class="it" x="500" y="538" width="420" height="30"/>
  <text class="t" x="710" y="557">गिफ्ट कटौती/हिस्सा (client_ref idempotent)</text>
  <rect class="it" x="500" y="574" width="420" height="30"/>
  <text class="t" x="710" y="593">IAP रिचार्ज 3-पक्ष सत्यापन idempotent</text>

  <!-- 数据与状态 -->
  <rect class="mod" x="20" y="636" width="920" height="76"/>
  <text class="tm" x="480" y="660">स्टेट और स्थिरता डिज़ाइन</text>
  <rect class="it" x="40" y="672" width="290" height="30"/>
  <text class="t" x="185" y="691">MySQL: तथ्य (उपयोगकर्ता/पोस्ट/रूम)</text>
  <rect class="it" x="350" y="672" width="290" height="30"/>
  <text class="t" x="495" y="691">Redis: सत्र / IM / कॉल / रूम</text>
  <rect class="it" x="660" y="672" width="260" height="30"/>
  <text class="t" x="790" y="691">REST ब्रॉडकास्ट no-op (ज्ञात)</text>
</svg>
