<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .s    { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; rx: 20 }
    .term { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.6; rx: 20 }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; rx: 20 }
    .t    { font-size: 13px; fill: #0f172a; text-anchor: middle }
    .ts   { font-size: 10.5px; fill: #64748b; text-anchor: middle }
    .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; rx: 10 }
    .lbl  { font-size: 14px; font-weight: 700; fill: #334155 }
    .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arr) }
    .el   { font-size: 10.5px; fill: #475569; text-anchor: middle }
  </style>

  <!-- 泳道 1：消息投递 -->
  <text class="lbl" x="24" y="36">① संदेश वितरण चक्र</text>
  <rect class="lane" x="20" y="48" width="920" height="120"/>
  <rect class="s" x="40" y="78" width="150" height="56"/>
  <text class="t" x="115" y="101">भेजें (WS फ्रेम)</text>
  <text class="ts" x="115" y="119">क्लाइंट → :8789</text>
  <rect class="s" x="260" y="78" width="150" height="56"/>
  <text class="t" x="335" y="101">सर्वर पर सेव</text>
  <text class="ts" x="335" y="119">MySQL संदेश + Redis इंडेक्स</text>
  <rect class="s" x="480" y="78" width="150" height="56"/>
  <text class="t" x="555" y="101">रियलटाइम पुश</text>
  <text class="ts" x="555" y="119">ऑनलाइन: Deliverer पुश</text>
  <rect class="term" x="700" y="78" width="210" height="56"/>
  <text class="t" x="805" y="101">पहुंचा / ऑफलाइन लाना</text>
  <text class="ts" x="805" y="119">ऑफलाइन: अगले लॉगिन पर · अपठित</text>
  <path class="edge" d="M 190 106 L 260 106"/>
  <path class="edge" d="M 410 106 L 480 106"/>
  <path class="edge" d="M 630 106 L 700 106"/>

  <!-- 泳道 2：1v1 通话 -->
  <text class="lbl" x="24" y="206">② 1v1 कॉल चक्र (CallCenter, Redis im:call:{id})</text>
  <rect class="lane" x="20" y="218" width="920" height="128"/>
  <rect class="s" x="40" y="248" width="140" height="60"/>
  <text class="t" x="110" y="271">निष्क्रिय</text>
  <text class="ts" x="110" y="289">im:callbusy लॉक</text>
  <rect class="s" x="250" y="248" width="150" height="60"/>
  <text class="t" x="325" y="271">घंटी</text>
  <text class="ts" x="325" y="289">30 सेकंड टाइमआउट</text>
  <rect class="term" x="470" y="248" width="140" height="60"/>
  <text class="t" x="540" y="271">कॉल में</text>
  <text class="ts" x="540" y="289">मीडिया सीधा / RTP</text>
  <rect class="term" x="680" y="248" width="130" height="60"/>
  <text class="t" x="745" y="271">समाप्त</text>
  <text class="ts" x="745" y="289">finish गेट</text>
  <rect class="fail" x="830" y="248" width="100" height="60"/>
  <text class="t" x="880" y="271">विफल</text>
  <text class="ts" x="880" y="289">टाइमआउट / व्यस्त</text>
  <path class="edge" d="M 180 278 L 250 278"/>
  <path class="edge" d="M 400 278 L 470 278"/>
  <path class="edge" d="M 610 278 L 680 278"/>
  <path class="edge" d="M 400 260 C 400 240, 820 240, 880 258"/>
  <text class="el" x="640" y="238">टाइमआउट / अस्वीकार</text>
  <path class="edge" d="M 325 308 C 325 330, 870 330, 875 308"/>
  <text class="el" x="640" y="336">व्यस्त SETNX</text>

  <!-- 泳道 3：语聊房 -->
  <text class="lbl" x="24" y="386">③ वॉइस रूम चक्र (DB rooms + Redis + SFU Router)</text>
  <rect class="lane" x="20" y="398" width="920" height="104"/>
  <rect class="s" x="40" y="418" width="150" height="60"/>
  <text class="t" x="115" y="441">बनाएं</text>
  <text class="ts" x="115" y="459">owner बनाए · SFU Router</text>
  <rect class="s" x="270" y="418" width="190" height="60"/>
  <text class="t" x="365" y="441">सक्रिय</text>
  <text class="ts" x="365" y="459">जुड़ें / 8 सीटें · रिले</text>
  <rect class="term" x="540" y="418" width="170" height="60"/>
  <text class="t" x="625" y="441">समाप्त</text>
  <text class="ts" x="625" y="459">owner छोड़े / close</text>
  <rect class="term" x="790" y="418" width="140" height="60"/>
  <text class="t" x="860" y="441">SFU रीसायकल</text>
  <text class="ts" x="860" y="459">Router 5 मिनट निष्क्रिय</text>
  <path class="edge" d="M 190 448 L 270 448"/>
  <path class="edge" d="M 460 448 L 540 448"/>
  <path class="edge" d="M 710 448 L 790 448"/>
</svg>
