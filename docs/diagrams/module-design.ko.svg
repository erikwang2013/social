<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .mod  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; rx: 10 }
    .it   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6 }
    .tm   { font-size: 14px; font-weight: 700; fill: #1e3a8a; text-anchor: middle }
    .t    { font-size: 11.5px; fill: #0f172a; text-anchor: middle }
  </style>

  <!-- 接入层 -->
  <rect class="mod" x="20" y="20" width="920" height="86"/>
  <text class="tm" x="480" y="44">액세스 계층 · service/config/process.php (Http + WsServer)</text>
  <rect class="it" x="40" y="56" width="440" height="38"/>
  <text class="t" x="260" y="70">HTTP :8788 · 라우팅 전 X-Api-Version</text>
  <text class="t" x="260" y="84" font-size="10" fill="#64748b">기본 v1 · v\d+ 검증 · /api/vX 호환 (Http.php)</text>
  <rect class="it" x="500" y="56" width="420" height="38"/>
  <text class="t" x="710" y="70">WS :8789 · Envelope 프레임</text>
  <text class="t" x="710" y="84" font-size="10" fill="#64748b">ActionHandler 디스패치 · ConnectionRegistry uid→fd</text>

  <!-- IM 模块 -->
  <rect class="mod" x="20" y="126" width="440" height="150"/>
  <text class="tm" x="240" y="150">IM 모듈 · app/ws + app/im</text>
  <rect class="it" x="40" y="162" width="400" height="30"/>
  <text class="t" x="240" y="181">Deliverer 전송 · WsRedis 세션</text>
  <rect class="it" x="40" y="198" width="400" height="30"/>
  <text class="t" x="240" y="217">1v1 대화 / 텍스트 / 음성 (type=3)</text>
  <rect class="it" x="40" y="234" width="400" height="30"/>
  <text class="t" x="240" y="253">음성 업로드 → gRPC Rust VoiceStorage (m4a)</text>

  <!-- 通话模块 -->
  <rect class="mod" x="480" y="126" width="460" height="150"/>
  <text class="tm" x="710" y="150">1v1 통화 · Rust bee_live (HTTP는 gRPC · WS는 PHP)</text>
  <rect class="it" x="500" y="162" width="420" height="30"/>
  <text class="t" x="710" y="181">Redis im:call:{id} 상태머신 (HSET)</text>
  <rect class="it" x="500" y="198" width="420" height="30"/>
  <text class="t" x="710" y="217">im:callbusy 통화중 배타 (SETNX TTL 300)</text>
  <rect class="it" x="500" y="234" width="420" height="30"/>
  <text class="t" x="710" y="253">30초 타임아웃 · finish 일회성 (NX+EX 3600)</text>

  <!-- 语聊房模块 -->
  <rect class="mod" x="20" y="296" width="440" height="150"/>
  <text class="tm" x="240" y="320">음성방 · Rust bee_live (HTTP는 gRPC · WS는 PHP)</text>
  <rect class="it" x="40" y="332" width="400" height="30"/>
  <text class="t" x="240" y="351">DB rooms/room_members 사실 · Redis 온라인표</text>
  <rect class="it" x="40" y="368" width="400" height="30"/>
  <text class="t" x="240" y="387">8석 · join TOCTOU 재검증 · close 브로드캐스트</text>
  <rect class="it" x="40" y="404" width="400" height="30"/>
  <text class="t" x="240" y="423">sfuRelay 시그널 변환 · HTTP → SFU</text>

  <!-- SFU 模块 -->
  <rect class="mod" x="480" y="296" width="460" height="150"/>
  <text class="tm" x="710" y="320">미디어 계층 · media/sfu/server.js (mediasoup 3.14)</text>
  <rect class="it" x="500" y="332" width="420" height="30"/>
  <text class="t" x="710" y="351">방마다 Router · transports/producers/consumers</text>
  <rect class="it" x="500" y="368" width="420" height="30"/>
  <text class="t" x="710" y="387">RTC UDP 10000-10200 · 5분 후 회수</text>
  <rect class="it" x="500" y="404" width="420" height="30"/>
  <text class="t" x="710" y="423">coturn TURN :3478 · 요청 64KB 제한</text>

  <!-- 直播模块 -->
  <rect class="mod" x="20" y="466" width="440" height="150"/>
  <text class="tm" x="240" y="490">라이브 모듈 · Rust bee_live (HTTP는 gRPC · WS는 PHP)</text>
  <rect class="it" x="40" y="502" width="400" height="30"/>
  <text class="t" x="240" y="521">방/스트림 상태 머신 (MySQL 사실)</text>
  <rect class="it" x="40" y="538" width="400" height="30"/>
  <text class="t" x="240" y="557">WS 브로드캐스트 채널 (live:{room}:online)</text>
  <rect class="it" x="40" y="574" width="400" height="30"/>
  <text class="t" x="240" y="593">선물 효과 live_gift 같은 채널</text>

  <!-- 虚拟经济 -->
  <rect class="mod" x="480" y="466" width="460" height="150"/>
  <text class="tm" x="710" y="490">가상경제 · app/common (PHP)</text>
  <rect class="it" x="500" y="502" width="420" height="30"/>
  <text class="t" x="710" y="521">지갑 잔액/원장 (MySQL 유일한 사실 소스)</text>
  <rect class="it" x="500" y="538" width="420" height="30"/>
  <text class="t" x="710" y="557">선물 차감/분배 (client_ref 멱등)</text>
  <rect class="it" x="500" y="574" width="420" height="30"/>
  <text class="t" x="710" y="593">IAP 충전 3측 검증 멱등 입금</text>

  <!-- 数据与状态 -->
  <rect class="mod" x="20" y="636" width="920" height="76"/>
  <text class="tm" x="480" y="660">상태와 일관성 설계</text>
  <rect class="it" x="40" y="672" width="290" height="30"/>
  <text class="t" x="185" y="691">MySQL: 비즈니스 사실 (사용자/게시물/방)</text>
  <rect class="it" x="350" y="672" width="290" height="30"/>
  <text class="t" x="495" y="691">Redis: 세션 / IM / 통화 / 방 온라인</text>
  <rect class="it" x="660" y="672" width="260" height="30"/>
  <text class="t" x="790" y="691">REST 브로드캐스트 타프로세스 no-op (알려짐)</text>
</svg>
