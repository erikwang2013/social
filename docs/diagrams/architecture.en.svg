<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <style>
    .layer { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; rx: 10 }
    .box   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 8 }
    .boxb  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 8 }
    .boxg  { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 8 }
    .boxy  { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; rx: 8 }
    .lt    { font-size: 15px; font-weight: 700; fill: #334155 }
    .t     { font-size: 13px; fill: #0f172a; text-anchor: middle }
    .ts    { font-size: 11.5px; fill: #475569; text-anchor: middle }
    .edge  { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arr) }
    .edgeg { stroke: #16a34a; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrg) }
    .el    { font-size: 11px; fill: #64748b }
  </style>

  <!-- 客户端层 -->
  <g>
    <rect class="layer" x="20" y="20" width="920" height="86"/>
    <text class="lt" x="36" y="44">Client Layer</text>
    <rect class="box" x="40" y="56" width="200" height="38"/>
    <text class="t" x="140" y="79">Android · Kotlin + Compose</text>
    <rect class="box" x="260" y="56" width="200" height="38"/>
    <text class="t" x="360" y="79">iOS · SwiftUI</text>
    <rect class="box" x="480" y="56" width="200" height="38"/>
    <text class="t" x="580" y="79">HarmonyOS · ArkTS</text>
    <rect class="box" x="700" y="56" width="220" height="38"/>
    <text class="t" x="810" y="79">Admin Console · Flutter</text>
  </g>

  <!-- 接入层 -->
  <g>
    <rect class="layer" x="20" y="146" width="920" height="106"/>
    <text class="lt" x="36" y="170">Access Layer · service (webman v2, PHP 8.3)</text>
    <rect class="boxb" x="60" y="182" width="400" height="52"/>
    <text class="t" x="260" y="204">HTTP REST · :8788</text>
    <text class="ts" x="260" y="222">X-Api-Version middleware (default v1, /api/vX compat)</text>
    <rect class="boxb" x="500" y="182" width="420" height="52"/>
    <text class="t" x="710" y="204">WebSocket Signaling · :8789</text>
    <text class="ts" x="710" y="222">Envelope frames · Deliverer push · msg/call/room signaling</text>
  </g>

  <!-- 业务层 -->
  <g>
    <rect class="layer" x="20" y="292" width="920" height="106"/>
    <text class="lt" x="36" y="316">Business Layer</text>
    <rect class="box" x="40" y="328" width="200" height="56"/>
    <text class="t" x="140" y="350">Users / Feed Community</text>
    <text class="ts" x="140" y="368">Auth · Posts · Comments · Follows</text>
    <rect class="box" x="260" y="328" width="200" height="56"/>
    <text class="t" x="360" y="350">IM</text>
    <text class="ts" x="360" y="368">1v1 text / voice msgs · notifications</text>
    <rect class="box" x="480" y="328" width="220" height="56"/>
    <text class="t" x="590" y="350">Live / Voice Room / 1v1 Call</text>
    <text class="ts" x="590" y="368">Rust state machine (bee_live) · gRPC :50051</text>
    <rect class="box" x="720" y="328" width="200" height="56"/>
    <text class="t" x="820" y="350">Virtual Economy (PHP)</text>
    <text class="ts" x="820" y="368">Wallet · Gift tipping · Streamer share · IAP top-up</text>
  </g>

  <!-- 媒体层 -->
  <g>
    <rect class="layer" x="20" y="438" width="920" height="86"/>
    <text class="lt" x="36" y="462">Media Layer · media/ (Node.js)</text>
    <rect class="boxg" x="60" y="474" width="400" height="38"/>
    <text class="t" x="260" y="497">mediasoup SFU · :8790（RTC UDP 10000-10200）</text>
    <rect class="boxg" x="500" y="474" width="420" height="38"/>
    <text class="t" x="710" y="497">coturn TURN/STUN · :3478 (NAT fallback relay)</text>
  </g>

  <!-- 数据 / 计算层 -->
  <g>
    <rect class="layer" x="20" y="564" width="920" height="56"/>
    <text class="lt" x="36" y="588">Data / Compute Layer</text>
    <rect class="boxy" x="60" y="578" width="200" height="32"/>
    <text class="t" x="160" y="599">MySQL (source of truth)</text>
    <rect class="boxy" x="290" y="578" width="220" height="32"/>
    <text class="t" x="400" y="599">Redis (session / IM / call / room state)</text>
    <rect class="boxy" x="540" y="578" width="180" height="32"/>
    <text class="t" x="630" y="599">infrastructure · bee-rust（gRPC）</text>
    <rect class="boxy" x="750" y="578" width="170" height="32"/>
    <text class="t" x="835" y="599">contracts · protobuf</text>
  </g>

  <!-- 连线 -->
  <path class="edge" d="M 140 94 L 140 182"/>
  <path class="edge" d="M 360 94 L 360 182"/>
  <path class="edge" d="M 580 94 L 580 182"/>
  <path class="edge" d="M 810 94 L 810 182"/>
  <path class="edge" d="M 260 234 L 260 328"/>
  <path class="edge" d="M 710 234 L 710 328"/>
  <path class="edgeg" d="M 460 252 L 930 252 L 930 594 L 720 594"/>
  <text class="el" x="840" y="434">gRPC :50051</text>
  <path class="edge" d="M 590 384 L 590 474"/>
  <path class="edge" d="M 140 384 L 140 578"/>
  <path class="edge" d="M 360 384 L 360 578"/>
  <path class="edge" d="M 820 384 L 820 578"/>
  <path class="edgeg" d="M 340 512 L 340 578"/>
  <text class="el" x="352" y="552">RTP media direct (UDP)</text>
</svg>
