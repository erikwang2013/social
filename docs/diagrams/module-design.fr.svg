<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 856" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .mod  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; rx: 10 }
    .it   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6 }
    .tm   { font-size: 14px; font-weight: 700; fill: #1e3a8a; text-anchor: middle }
    .t    { font-size: 11.5px; fill: #0f172a; text-anchor: middle }
  </style>

  <!-- 接入层 -->
  <rect class="mod" x="20" y="20" width="920" height="86"/>
  <text class="tm" x="480" y="44">Accès · service/config/process.php (Http + WsServer)</text>
  <rect class="it" x="40" y="56" width="440" height="38"/>
  <text class="t" x="260" y="70">HTTP :8788 · X-Api-Version avant route</text>
  <text class="t" x="260" y="84" font-size="10" fill="#64748b">défaut v1 · valider v\d+ · /api/vX (Http.php)</text>
  <rect class="it" x="500" y="56" width="420" height="38"/>
  <text class="t" x="710" y="70">WS :8789 · frames Envelope</text>
  <text class="t" x="710" y="84" font-size="10" fill="#64748b">Dispatch ActionHandler · ConnectionRegistry uid→fd</text>

  <!-- IM 模块 -->
  <rect class="mod" x="20" y="126" width="440" height="150"/>
  <text class="tm" x="240" y="150">Module IM · app/ws + app/im</text>
  <rect class="it" x="40" y="162" width="400" height="30"/>
  <text class="t" x="240" y="181">Livraison Deliverer · état WsRedis</text>
  <rect class="it" x="40" y="198" width="400" height="30"/>
  <text class="t" x="240" y="217">Chat 1v1 / texte / vocal (type=3)</text>
  <rect class="it" x="40" y="234" width="400" height="30"/>
  <text class="t" x="240" y="253">Upload vocal → gRPC Rust VoiceStorage (m4a)</text>

  <!-- 通话模块 -->
  <rect class="mod" x="480" y="126" width="460" height="150"/>
  <text class="tm" x="710" y="150">Appel 1v1 · Rust bee_live (HTTP via gRPC · WS via PHP)</text>
  <rect class="it" x="500" y="162" width="420" height="30"/>
  <text class="t" x="710" y="181">Redis im:call:{id} machine à états (HSET)</text>
  <rect class="it" x="500" y="198" width="420" height="30"/>
  <text class="t" x="710" y="217">im:callbusy occupation (SETNX TTL 300)</text>
  <rect class="it" x="500" y="234" width="420" height="30"/>
  <text class="t" x="710" y="253">Timeout 30s · gate unique finish (NX+EX 3600)</text>

  <!-- 语聊房模块 -->
  <rect class="mod" x="20" y="296" width="440" height="150"/>
  <text class="tm" x="240" y="320">Salon vocal · Rust bee_live (HTTP via gRPC · WS via PHP)</text>
  <rect class="it" x="40" y="332" width="400" height="30"/>
  <text class="t" x="240" y="351">DB rooms/room_members faits · Redis en ligne</text>
  <rect class="it" x="40" y="368" width="400" height="30"/>
  <text class="t" x="240" y="387">8 sièges · recheck TOCTOU · diff. close</text>
  <rect class="it" x="40" y="404" width="400" height="30"/>
  <text class="t" x="240" y="423">sfuRelay traduction · HTTP → SFU</text>

  <!-- SFU 模块 -->
  <rect class="mod" x="480" y="296" width="460" height="150"/>
  <text class="tm" x="710" y="320">Média · media/sfu/server.js (mediasoup 3.14)</text>
  <rect class="it" x="500" y="332" width="420" height="30"/>
  <text class="t" x="710" y="351">Un Router par salon · transports/producers/consumers</text>
  <rect class="it" x="500" y="368" width="420" height="30"/>
  <text class="t" x="710" y="387">RTC UDP 10000-10200 · recyclage 5min</text>
  <rect class="it" x="500" y="404" width="420" height="30"/>
  <text class="t" x="710" y="423">coturn TURN :3478 · limite 64KB</text>

  <!-- 直播模块 -->
  <rect class="mod" x="20" y="466" width="440" height="150"/>
  <text class="tm" x="240" y="490">Module Live · Rust bee_live (HTTP via gRPC · WS via PHP)</text>
  <rect class="it" x="40" y="502" width="400" height="30"/>
  <text class="t" x="240" y="521">Machine à états salon/stream (MySQL faits)</text>
  <rect class="it" x="40" y="538" width="400" height="30"/>
  <text class="t" x="240" y="557">Canal de diffusion WS (live:{room}:online)</text>
  <rect class="it" x="40" y="574" width="400" height="30"/>
  <text class="t" x="240" y="593">Effets cadeaux live_gift même canal</text>

  <!-- 虚拟经济 -->
  <rect class="mod" x="480" y="466" width="460" height="186"/>
  <text class="tm" x="710" y="490">Économie virtuelle · app/common (PHP)</text>
  <rect class="it" x="500" y="502" width="420" height="30"/>
  <text class="t" x="710" y="521">Portefeuille solde/journal (MySQL seule source)</text>
  <rect class="it" x="500" y="538" width="420" height="30"/>
  <text class="t" x="710" y="557">Cadeau débit/partage (client_ref idempotent)</text>
  <rect class="it" x="500" y="574" width="420" height="30"/>
  <text class="t" x="710" y="593">Recharge IAP vérif. 3 côtés idempotent</text>
  <rect class="it" x="500" y="610" width="420" height="30"/>
  <text class="t" x="710" y="629">Canaux de paiement WeChat/Alipay/Stripe vérif. callback</text>

  <!-- 数据与状态 -->
  <rect class="mod" x="20" y="672" width="920" height="76"/>
  <text class="tm" x="480" y="696">Conception état &amp; cohérence</text>
  <rect class="it" x="40" y="708" width="290" height="30"/>
  <text class="t" x="185" y="727">MySQL : faits (utilisateurs/posts/salons)</text>
  <rect class="it" x="350" y="708" width="290" height="30"/>
  <text class="t" x="495" y="727">Redis : session / IM / appel / salon</text>
  <rect class="it" x="660" y="708" width="260" height="30"/>
  <text class="t" x="790" y="727">Broadcast REST no-op (connu)</text>
  <!-- CDN 存储模块 -->
  <rect class="mod" x="20" y="768" width="920" height="76"/>
  <text class="tm" x="480" y="792">Stockage CDN · app/common/Storage + admin (compatible S3)</text>
  <rect class="it" x="40" y="804" width="290" height="30"/>
  <text class="t" x="185" y="823">Upload → vérification PHP + filigrane</text>
  <rect class="it" x="350" y="804" width="290" height="30"/>
  <text class="t" x="495" y="823">Stockage objet (S3/R2/OSS/COS/B2)</text>
  <rect class="it" x="660" y="804" width="260" height="30"/>
  <text class="t" x="790" y="823">CDN edge · configurable via l'admin</text>
</svg>
