<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .mod  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; rx: 10 }
    .it   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6 }
    .tm   { font-size: 14px; font-weight: 700; fill: #1e3a8a; text-anchor: middle }
    .t    { font-size: 11.5px; fill: #0f172a; text-anchor: middle }
  </style>

  <!-- 接入层 -->
  <rect class="mod" x="20" y="20" width="920" height="86"/>
  <text class="tm" x="480" y="44">接入层 · service/config/process.php（Http + WsServer 双进程）</text>
  <rect class="it" x="40" y="56" width="440" height="38"/>
  <text class="t" x="260" y="70">HTTP :8788 · 路由前 X-Api-Version 版本化</text>
  <text class="t" x="260" y="84" font-size="10" fill="#64748b">默认 v1 · v\d+ 校验 · /api/vX 兼容（Http.php）</text>
  <rect class="it" x="500" y="56" width="420" height="38"/>
  <text class="t" x="710" y="70">WS :8789 · Envelope 帧协议</text>
  <text class="t" x="710" y="84" font-size="10" fill="#64748b">ActionHandler 分发 · ConnectionRegistry uid→fd</text>

  <!-- IM 模块 -->
  <rect class="mod" x="20" y="126" width="440" height="150"/>
  <text class="tm" x="240" y="150">IM 模块 · app/ws + app/im</text>
  <rect class="it" x="40" y="162" width="400" height="30"/>
  <text class="t" x="240" y="181">Deliverer 投递 · WsRedis 会话状态</text>
  <rect class="it" x="40" y="198" width="400" height="30"/>
  <text class="t" x="240" y="217">1v1 会话 / 文本 / 语音消息（type=3）</text>
  <rect class="it" x="40" y="234" width="400" height="30"/>
  <text class="t" x="240" y="253">语音上传 → gRPC Rust VoiceStorage（m4a）</text>

  <!-- 通话模块 -->
  <rect class="mod" x="480" y="126" width="460" height="150"/>
  <text class="tm" x="710" y="150">1v1 通话 · Rust bee_live（HTTP 经 gRPC · WS 走 PHP）</text>
  <rect class="it" x="500" y="162" width="420" height="30"/>
  <text class="t" x="710" y="181">Redis im:call:{id} 状态机（HSET）</text>
  <rect class="it" x="500" y="198" width="420" height="30"/>
  <text class="t" x="710" y="217">im:callbusy 忙线互斥（SETNX TTL 300）</text>
  <rect class="it" x="500" y="234" width="420" height="30"/>
  <text class="t" x="710" y="253">30s 响铃超时 · finish 一次性门（NX+EX 3600）</text>

  <!-- 语聊房模块 -->
  <rect class="mod" x="20" y="296" width="440" height="150"/>
  <text class="tm" x="240" y="320">语聊房 · Rust bee_live（HTTP 经 gRPC · WS 走 PHP）</text>
  <rect class="it" x="40" y="332" width="400" height="30"/>
  <text class="t" x="240" y="351">DB rooms/room_members 为事实 · Redis 在线表</text>
  <rect class="it" x="40" y="368" width="400" height="30"/>
  <text class="t" x="240" y="387">8 麦位 · join TOCTOU 复核 · close 广播</text>
  <rect class="it" x="40" y="404" width="400" height="30"/>
  <text class="t" x="240" y="423">sfuRelay 信令转译 · 裸 HTTP → SFU</text>

  <!-- SFU 模块 -->
  <rect class="mod" x="480" y="296" width="460" height="150"/>
  <text class="tm" x="710" y="320">媒体层 · media/sfu/server.js（mediasoup 3.14）</text>
  <rect class="it" x="500" y="332" width="420" height="30"/>
  <text class="t" x="710" y="351">每房间一个 Router · transports/producers/consumers</text>
  <rect class="it" x="500" y="368" width="420" height="30"/>
  <text class="t" x="710" y="387">RTC UDP 10000-10200 · 空置 5min 回收</text>
  <rect class="it" x="500" y="404" width="420" height="30"/>
  <text class="t" x="710" y="423">coturn TURN :3478 · 请求体 64KB 上限</text>

  <!-- 数据与状态 -->
  <rect class="mod" x="20" y="466" width="920" height="76"/>
  <text class="tm" x="480" y="490">状态与一致性设计</text>
  <rect class="it" x="40" y="502" width="290" height="30"/>
  <text class="t" x="185" y="521">MySQL：业务事实（用户/帖子/房间）</text>
  <rect class="it" x="350" y="502" width="290" height="30"/>
  <text class="t" x="495" y="521">Redis：会话 / IM / 通话 / 房间在线</text>
  <rect class="it" x="660" y="502" width="260" height="30"/>
  <text class="t" x="790" y="521">REST 广播跨进程 no-op（已知）</text>
</svg>
