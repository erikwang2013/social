<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .root { fill: #1e3a8a; stroke: #1e3a8a; rx: 10 }
    .mod  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 8 }
    .fn   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6 }
    .t    { font-size: 13.5px; fill: #0f172a; text-anchor: middle }
    .tr   { font-size: 16px; font-weight: 700; fill: #ffffff; text-anchor: middle }
    .tm   { font-size: 14px; font-weight: 700; fill: #1e3a8a; text-anchor: middle }
    .ts   { font-size: 11px; fill: #d97706; text-anchor: middle }
    .edge { stroke: #94a3b8; stroke-width: 1.4; fill: none; marker-end: url(#arr) }
  </style>

  <rect class="root" x="380" y="16" width="200" height="44"/>
  <text class="tr" x="480" y="44">ソーシャルプラットフォーム</text>

  <!-- 账户与鉴权 -->
  <rect class="mod" x="30" y="96" width="200" height="40"/>
  <text class="tm" x="130" y="121">アカウントと認証</text>
  <path class="edge" d="M 480 60 L 130 96"/>
  <rect class="fn" x="30" y="148" width="200" height="26"/><text class="t" x="130" y="166">登録 / ログイン / 更新 (JWT)</text>
  <rect class="fn" x="30" y="180" width="200" height="26"/><text class="t" x="130" y="198">X-Api-Version バージョン API</text>

  <!-- 图文社区 -->
  <rect class="mod" x="262" y="96" width="200" height="40"/>
  <text class="tm" x="362" y="121">投稿コミュニティ</text>
  <path class="edge" d="M 480 60 L 362 96"/>
  <rect class="fn" x="262" y="148" width="200" height="26"/><text class="t" x="362" y="166">投稿 / タイムライン / 詳細</text>
  <rect class="fn" x="262" y="180" width="200" height="26"/><text class="t" x="362" y="198">いいね / コメント / フォロー</text>
  <rect class="fn" x="262" y="212" width="200" height="26"/><text class="t" x="362" y="230">検索 / 通知 (未読)</text>

  <!-- IM -->
  <rect class="mod" x="494" y="96" width="200" height="40"/>
  <text class="tm" x="594" y="121">インスタントメッセージ IM</text>
  <path class="edge" d="M 480 60 L 594 96"/>
  <rect class="fn" x="494" y="148" width="200" height="26"/><text class="t" x="594" y="166">1v1 会話 / テキスト</text>
  <rect class="fn" x="494" y="180" width="200" height="26"/><text class="t" x="594" y="198">音声メッセージ (アップロード / 再生)</text>
  <rect class="fn" x="494" y="212" width="200" height="26"/><text class="t" x="594" y="230">WS リアルタイム / 端末プッシュ</text>

  <!-- 语音通话 -->
  <rect class="mod" x="726" y="96" width="200" height="40"/>
  <text class="tm" x="826" y="121">1v1 音声通話</text>
  <path class="edge" d="M 480 60 L 826 96"/>
  <rect class="fn" x="726" y="148" width="200" height="26"/><text class="t" x="826" y="166">招待 / 応答 / 拒否 / 切断</text>
  <rect class="fn" x="726" y="180" width="200" height="26"/><text class="t" x="826" y="198">30秒で自動失敗</text>
  <rect class="fn" x="726" y="212" width="200" height="26"/><text class="t" x="826" y="230">ビジー排他 (割り込み不可)</text>

  <!-- 语聊房 -->
  <rect class="mod" x="130" y="290" width="320" height="40"/>
  <text class="tm" x="290" y="315">ボイスチャットルーム</text>
  <path class="edge" d="M 480 60 L 290 290"/>
  <rect class="fn" x="130" y="342" width="320" height="26"/><text class="t" x="290" y="360">作成 / 参加 / 退出 / 解散 · 8席</text>
  <rect class="fn" x="130" y="374" width="320" height="26"/><text class="t" x="290" y="392">mediasoup SFU 中継 · 5分で回収</text>

  <!-- 直播与虚拟经济 -->
  <rect class="mod" x="510" y="290" width="320" height="40"/>
  <text class="tm" x="670" y="315">ライブ / 仮想経済</text>
  <path class="edge" d="M 480 60 L 670 290"/>
  <rect class="fn" x="510" y="342" width="320" height="26"/><text class="t" x="670" y="360">ライブ配信 · Rust 状態マシン · gRPC</text>
  <rect class="fn" x="510" y="374" width="320" height="26"/><text class="t" x="670" y="392">ウォレット · 投げ銭 · 配信者分配 · IAP チャージ</text>
</svg>
