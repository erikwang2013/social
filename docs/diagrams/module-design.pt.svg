<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 856" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .mod  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; rx: 10 }
    .it   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6 }
    .tm   { font-size: 14px; font-weight: 700; fill: #1e3a8a; text-anchor: middle }
    .t    { font-size: 11.5px; fill: #0f172a; text-anchor: middle }
  </style>

  <!-- 接入层 -->
  <rect class="mod" x="20" y="20" width="920" height="86"/>
  <text class="tm" x="480" y="44">Acesso · service/config/process.php (Http + WsServer)</text>
  <rect class="it" x="40" y="56" width="440" height="38"/>
  <text class="t" x="260" y="70">HTTP :8788 · X-Api-Version antes da rota</text>
  <text class="t" x="260" y="84" font-size="10" fill="#64748b">padrão v1 · validar v\d+ · /api/vX (Http.php)</text>
  <rect class="it" x="500" y="56" width="420" height="38"/>
  <text class="t" x="710" y="70">WS :8789 · frames Envelope</text>
  <text class="t" x="710" y="84" font-size="10" fill="#64748b">Dispatch ActionHandler · ConnectionRegistry uid→fd</text>

  <!-- IM 模块 -->
  <rect class="mod" x="20" y="126" width="440" height="150"/>
  <text class="tm" x="240" y="150">Módulo IM · app/ws + app/im</text>
  <rect class="it" x="40" y="162" width="400" height="30"/>
  <text class="t" x="240" y="181">Entrega Deliverer · estado WsRedis</text>
  <rect class="it" x="40" y="198" width="400" height="30"/>
  <text class="t" x="240" y="217">Chat 1v1 / texto / voz (type=3)</text>
  <rect class="it" x="40" y="234" width="400" height="30"/>
  <text class="t" x="240" y="253">Enviar voz → gRPC Rust VoiceStorage (m4a)</text>

  <!-- 通话模块 -->
  <rect class="mod" x="480" y="126" width="460" height="150"/>
  <text class="tm" x="710" y="150">Chamada 1v1 · Rust bee_live (HTTP via gRPC · WS via PHP)</text>
  <rect class="it" x="500" y="162" width="420" height="30"/>
  <text class="t" x="710" y="181">Redis im:call:{id} máq. de estados (HSET)</text>
  <rect class="it" x="500" y="198" width="420" height="30"/>
  <text class="t" x="710" y="217">im:callbusy ocupado (SETNX TTL 300)</text>
  <rect class="it" x="500" y="234" width="420" height="30"/>
  <text class="t" x="710" y="253">Timeout 30s · portão único finish (NX+EX 3600)</text>

  <!-- 语聊房模块 -->
  <rect class="mod" x="20" y="296" width="440" height="150"/>
  <text class="tm" x="240" y="320">Sala de voz · Rust bee_live (HTTP via gRPC · WS via PHP)</text>
  <rect class="it" x="40" y="332" width="400" height="30"/>
  <text class="t" x="240" y="351">DB rooms/room_members fatos · Redis online</text>
  <rect class="it" x="40" y="368" width="400" height="30"/>
  <text class="t" x="240" y="387">8 lugares · rever TOCTOU · broadcast close</text>
  <rect class="it" x="40" y="404" width="400" height="30"/>
  <text class="t" x="240" y="423">sfuRelay tradução · HTTP → SFU</text>

  <!-- SFU 模块 -->
  <rect class="mod" x="480" y="296" width="460" height="150"/>
  <text class="tm" x="710" y="320">Mídia · media/sfu/server.js (mediasoup 3.14)</text>
  <rect class="it" x="500" y="332" width="420" height="30"/>
  <text class="t" x="710" y="351">Um Router por sala · transports/producers/consumers</text>
  <rect class="it" x="500" y="368" width="420" height="30"/>
  <text class="t" x="710" y="387">RTC UDP 10000-10200 · reciclar 5min</text>
  <rect class="it" x="500" y="404" width="420" height="30"/>
  <text class="t" x="710" y="423">coturn TURN :3478 · limite 64KB</text>

  <!-- 直播模块 -->
  <rect class="mod" x="20" y="466" width="440" height="150"/>
  <text class="tm" x="240" y="490">Módulo ao vivo · Rust bee_live (HTTP via gRPC · WS via PHP)</text>
  <rect class="it" x="40" y="502" width="400" height="30"/>
  <text class="t" x="240" y="521">Máquina de estados sala/stream (MySQL fatos)</text>
  <rect class="it" x="40" y="538" width="400" height="30"/>
  <text class="t" x="240" y="557">Canal broadcast WS (live:{room}:online)</text>
  <rect class="it" x="40" y="574" width="400" height="30"/>
  <text class="t" x="240" y="593">Efeitos de presentes live_gift mesmo canal</text>

  <!-- 虚拟经济 -->
  <rect class="mod" x="480" y="466" width="460" height="186"/>
  <text class="tm" x="710" y="490">Economia virtual · app/common (PHP)</text>
  <rect class="it" x="500" y="502" width="420" height="30"/>
  <text class="t" x="710" y="521">Carteira saldo/extrato (MySQL única fonte)</text>
  <rect class="it" x="500" y="538" width="420" height="30"/>
  <text class="t" x="710" y="557">Presente débito/divisão (client_ref idempotente)</text>
  <rect class="it" x="500" y="574" width="420" height="30"/>
  <text class="t" x="710" y="593">Recarga IAP verificação 3 lados idempotente</text>
  <rect class="it" x="500" y="610" width="420" height="30"/>
  <text class="t" x="710" y="629">Canais de pagamento WeChat/Alipay/Stripe verificação callback</text>

  <!-- 数据与状态 -->
  <rect class="mod" x="20" y="672" width="920" height="76"/>
  <text class="tm" x="480" y="696">Design de estado e consistência</text>
  <rect class="it" x="40" y="708" width="290" height="30"/>
  <text class="t" x="185" y="727">MySQL: fatos (usuários/posts/salas)</text>
  <rect class="it" x="350" y="708" width="290" height="30"/>
  <text class="t" x="495" y="727">Redis: sessão / IM / chamada / sala</text>
  <rect class="it" x="660" y="708" width="260" height="30"/>
  <text class="t" x="790" y="727">Broadcast REST no-op (conhecido)</text>
  <!-- CDN 存储模块 -->
  <rect class="mod" x="20" y="768" width="920" height="76"/>
  <text class="tm" x="480" y="792">Armazenamento CDN · app/common/Storage + admin (compatível com S3)</text>
  <rect class="it" x="40" y="804" width="290" height="30"/>
  <text class="t" x="185" y="823">Upload → verificação PHP + marca d'água</text>
  <rect class="it" x="350" y="804" width="290" height="30"/>
  <text class="t" x="495" y="823">Armazenamento de objetos (S3/R2/OSS/COS/B2)</text>
  <rect class="it" x="660" y="804" width="260" height="30"/>
  <text class="t" x="790" y="823">CDN edge · configurável no admin</text>
</svg>
