<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .root { fill: #1e3a8a; stroke: #1e3a8a; rx: 10 }
    .mod  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 8 }
    .fn   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6 }
    .plan { fill: #fffbeb; stroke: #d97706; stroke-width: 1.2; rx: 6; stroke-dasharray: 5 3 }
    .t    { font-size: 13.5px; fill: #0f172a; text-anchor: middle }
    .tr   { font-size: 16px; font-weight: 700; fill: #ffffff; text-anchor: middle }
    .tm   { font-size: 14px; font-weight: 700; fill: #1e3a8a; text-anchor: middle }
    .ts   { font-size: 11px; fill: #d97706; text-anchor: middle }
    .edge { stroke: #94a3b8; stroke-width: 1.4; fill: none; marker-end: url(#arr) }
  </style>

  <rect class="root" x="380" y="16" width="200" height="44"/>
  <text class="tr" x="480" y="44">सोशल प्लेटफ़ॉर्म</text>

  <!-- 账户与鉴权 -->
  <rect class="mod" x="30" y="96" width="200" height="40"/>
  <text class="tm" x="130" y="121">खाता और प्रमाणीकरण</text>
  <path class="edge" d="M 480 60 L 130 96"/>
  <rect class="fn" x="30" y="148" width="200" height="26"/><text class="t" x="130" y="166">पंजीकरण / लॉगिन / रीफ़्रेश (JWT)</text>
  <rect class="fn" x="30" y="180" width="200" height="26"/><text class="t" x="130" y="198">X-Api-Version संस्करण API</text>

  <!-- 图文社区 -->
  <rect class="mod" x="262" y="96" width="200" height="40"/>
  <text class="tm" x="362" y="121">पोस्ट समुदाय</text>
  <path class="edge" d="M 480 60 L 362 96"/>
  <rect class="fn" x="262" y="148" width="200" height="26"/><text class="t" x="362" y="166">पोस्ट / टाइमलाइन / विवरण</text>
  <rect class="fn" x="262" y="180" width="200" height="26"/><text class="t" x="362" y="198">लाइक / टिप्पणी / फ़ॉलो</text>
  <rect class="fn" x="262" y="212" width="200" height="26"/><text class="t" x="362" y="230">खोज / सूचनाएं (अपठित)</text>

  <!-- IM -->
  <rect class="mod" x="494" y="96" width="200" height="40"/>
  <text class="tm" x="594" y="121">इंस्टेंट मैसेजिंग IM</text>
  <path class="edge" d="M 480 60 L 594 96"/>
  <rect class="fn" x="494" y="148" width="200" height="26"/><text class="t" x="594" y="166">1v1 चैट / टेक्स्ट</text>
  <rect class="fn" x="494" y="180" width="200" height="26"/><text class="t" x="594" y="198">वॉइस संदेश (अपलोड / चलाना)</text>
  <rect class="fn" x="494" y="212" width="200" height="26"/><text class="t" x="594" y="230">WS पुश / डिवाइस टोकन</text>

  <!-- 语音通话 -->
  <rect class="mod" x="726" y="96" width="200" height="40"/>
  <text class="tm" x="826" y="121">1v1 वॉइस कॉल</text>
  <path class="edge" d="M 480 60 L 826 96"/>
  <rect class="fn" x="726" y="148" width="200" height="26"/><text class="t" x="826" y="166">आमंत्रण / उत्तर / अस्वीकार / काटना</text>
  <rect class="fn" x="726" y="180" width="200" height="26"/><text class="t" x="826" y="198">30 सेकंड में स्वतः विफल</text>
  <rect class="fn" x="726" y="212" width="200" height="26"/><text class="t" x="826" y="230">व्यस्त बहिष्करण</text>

  <!-- 语聊房 -->
  <rect class="mod" x="130" y="290" width="320" height="40"/>
  <text class="tm" x="290" y="315">वॉइस चैट रूम</text>
  <path class="edge" d="M 480 60 L 290 290"/>
  <rect class="fn" x="130" y="342" width="320" height="26"/><text class="t" x="290" y="360">बनाएं / जुड़ें / छोड़ें / समाप्त · 8 सीटें</text>
  <rect class="fn" x="130" y="374" width="320" height="26"/><text class="t" x="290" y="392">mediasoup SFU · 5 मिनट रीसायकल</text>

  <!-- 规划中 -->
  <rect class="plan" x="510" y="290" width="320" height="40"/>
  <text class="tm" x="670" y="315">लाइव / वर्चुअल अर्थव्यवस्था (M5)</text>
  <path class="edge" d="M 480 60 L 670 290"/>
  <rect class="plan" x="510" y="342" width="320" height="26"/><text class="t" x="670" y="360">लाइव स्ट्रीम (SRS)</text>
  <rect class="plan" x="510" y="374" width="320" height="26"/><text class="t" x="670" y="392">सिक्के / टिप्स / गिफ्ट</text>
</svg>
