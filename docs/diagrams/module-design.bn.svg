<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .mod  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; rx: 10 }
    .it   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6 }
    .tm   { font-size: 14px; font-weight: 700; fill: #1e3a8a; text-anchor: middle }
    .t    { font-size: 11.5px; fill: #0f172a; text-anchor: middle }
  </style>

  <!-- 接入层 -->
  <rect class="mod" x="20" y="20" width="920" height="86"/>
  <text class="tm" x="480" y="44">অ্যাক্সেস · service/config/process.php (Http + WsServer)</text>
  <rect class="it" x="40" y="56" width="440" height="38"/>
  <text class="t" x="260" y="70">HTTP :8788 · X-Api-Version আগে</text>
  <text class="t" x="260" y="84" font-size="10" fill="#64748b">ডিফল্ট v1 · v\d+ যাচাই · /api/vX (Http.php)</text>
  <rect class="it" x="500" y="56" width="420" height="38"/>
  <text class="t" x="710" y="70">WS :8789 · Envelope ফ্রেম</text>
  <text class="t" x="710" y="84" font-size="10" fill="#64748b">ActionHandler ডিসপ্যাচ · ConnectionRegistry uid→fd</text>

  <!-- IM 模块 -->
  <rect class="mod" x="20" y="126" width="440" height="150"/>
  <text class="tm" x="240" y="150">IM মডিউল · app/ws + app/im</text>
  <rect class="it" x="40" y="162" width="400" height="30"/>
  <text class="t" x="240" y="181">Deliverer · WsRedis সেশন</text>
  <rect class="it" x="40" y="198" width="400" height="30"/>
  <text class="t" x="240" y="217">1v1 চ্যাট / টেক্সট / ভয়েস (type=3)</text>
  <rect class="it" x="40" y="234" width="400" height="30"/>
  <text class="t" x="240" y="253">ভয়েস আপলোড → gRPC Rust VoiceStorage (m4a)</text>

  <!-- 通话模块 -->
  <rect class="mod" x="480" y="126" width="460" height="150"/>
  <text class="tm" x="710" y="150">1v1 কল · Rust bee_live (HTTP via gRPC · WS via PHP)</text>
  <rect class="it" x="500" y="162" width="420" height="30"/>
  <text class="t" x="710" y="181">Redis im:call:{id} স্টেট (HSET)</text>
  <rect class="it" x="500" y="198" width="420" height="30"/>
  <text class="t" x="710" y="217">im:callbusy ব্যস্ত (SETNX TTL 300)</text>
  <rect class="it" x="500" y="234" width="420" height="30"/>
  <text class="t" x="710" y="253">৩০ সেকেন্ড টাইমআউট · finish গেট (NX+EX 3600)</text>

  <!-- 语聊房模块 -->
  <rect class="mod" x="20" y="296" width="440" height="150"/>
  <text class="tm" x="240" y="320">ভয়েস রুম · Rust bee_live (HTTP via gRPC · WS via PHP)</text>
  <rect class="it" x="40" y="332" width="400" height="30"/>
  <text class="t" x="240" y="351">DB rooms/room_members তথ্য · Redis অনলাইন</text>
  <rect class="it" x="40" y="368" width="400" height="30"/>
  <text class="t" x="240" y="387">৮ আসন · TOCTOU · close সম্প্রচার</text>
  <rect class="it" x="40" y="404" width="400" height="30"/>
  <text class="t" x="240" y="423">sfuRelay অনুবাদ · HTTP → SFU</text>

  <!-- SFU 模块 -->
  <rect class="mod" x="480" y="296" width="460" height="150"/>
  <text class="tm" x="710" y="320">মিডিয়া · media/sfu/server.js (mediasoup 3.14)</text>
  <rect class="it" x="500" y="332" width="420" height="30"/>
  <text class="t" x="710" y="351">প্রতি রুমে Router · transports/producers/consumers</text>
  <rect class="it" x="500" y="368" width="420" height="30"/>
  <text class="t" x="710" y="387">RTC UDP 10000-10200 · ৫ মিনিট</text>
  <rect class="it" x="500" y="404" width="420" height="30"/>
  <text class="t" x="710" y="423">coturn TURN :3478 · 64KB সীমা</text>

  <!-- 数据与状态 -->
  <rect class="mod" x="20" y="466" width="920" height="76"/>
  <text class="tm" x="480" y="490">স্টেট ও সামঞ্জস্য ডিজাইন</text>
  <rect class="it" x="40" y="502" width="290" height="30"/>
  <text class="t" x="185" y="521">MySQL: তথ্য (ব্যবহারকারী/পোস্ট/রুম)</text>
  <rect class="it" x="350" y="502" width="290" height="30"/>
  <text class="t" x="495" y="521">Redis: সেশন / IM / কল / রুম</text>
  <rect class="it" x="660" y="502" width="260" height="30"/>
  <text class="t" x="790" y="521">REST ব্রডকাস্ট no-op (জ্ঞাত)</text>
</svg>
