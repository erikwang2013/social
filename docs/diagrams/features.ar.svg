<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .root { fill: #1e3a8a; stroke: #1e3a8a; rx: 10 }
    .mod  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 8 }
    .fn   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6 }
    .plan { fill: #fffbeb; stroke: #d97706; stroke-width: 1.2; rx: 6; stroke-dasharray: 5 3 }
    .t    { font-size: 13.5px; fill: #0f172a; text-anchor: middle }
    .tr   { font-size: 16px; font-weight: 700; fill: #ffffff; text-anchor: middle }
    .tm   { font-size: 14px; font-weight: 700; fill: #1e3a8a; text-anchor: middle }
    .ts   { font-size: 11px; fill: #d97706; text-anchor: middle }
    .edge { stroke: #94a3b8; stroke-width: 1.4; fill: none; marker-end: url(#arr) }
  </style>

  <rect class="root" x="380" y="16" width="200" height="44"/>
  <text class="tr" x="480" y="44">المنصة الاجتماعية</text>

  <!-- 账户与鉴权 -->
  <rect class="mod" x="30" y="96" width="200" height="40"/>
  <text class="tm" x="130" y="121">الحساب والمصادقة</text>
  <path class="edge" d="M 480 60 L 130 96"/>
  <rect class="fn" x="30" y="148" width="200" height="26"/><text class="t" x="130" y="166">تسجيل / دخول / تحديث (JWT)</text>
  <rect class="fn" x="30" y="180" width="200" height="26"/><text class="t" x="130" y="198">واجهة برمجة X-Api-Version</text>

  <!-- 图文社区 -->
  <rect class="mod" x="262" y="96" width="200" height="40"/>
  <text class="tm" x="362" y="121">مجتمع المنشورات</text>
  <path class="edge" d="M 480 60 L 362 96"/>
  <rect class="fn" x="262" y="148" width="200" height="26"/><text class="t" x="362" y="166">نشر / الخط الزمني / تفاصيل</text>
  <rect class="fn" x="262" y="180" width="200" height="26"/><text class="t" x="362" y="198">إعجاب / تعليق / متابعة</text>
  <rect class="fn" x="262" y="212" width="200" height="26"/><text class="t" x="362" y="230">بحث / إشعارات (غير مقروء)</text>

  <!-- IM -->
  <rect class="mod" x="494" y="96" width="200" height="40"/>
  <text class="tm" x="594" y="121">المراسلة الفورية IM</text>
  <path class="edge" d="M 480 60 L 594 96"/>
  <rect class="fn" x="494" y="148" width="200" height="26"/><text class="t" x="594" y="166">محادثة 1v1 / نصوص</text>
  <rect class="fn" x="494" y="180" width="200" height="26"/><text class="t" x="594" y="198">رسائل صوتية (رفع / تشغيل)</text>
  <rect class="fn" x="494" y="212" width="200" height="26"/><text class="t" x="594" y="230">دفع WS / رمز الدفع</text>

  <!-- 语音通话 -->
  <rect class="mod" x="726" y="96" width="200" height="40"/>
  <text class="tm" x="826" y="121">مكالمة صوتية 1v1</text>
  <path class="edge" d="M 480 60 L 826 96"/>
  <rect class="fn" x="726" y="148" width="200" height="26"/><text class="t" x="826" y="166">دعوة / رد / رفض / إنهاء</text>
  <rect class="fn" x="726" y="180" width="200" height="26"/><text class="t" x="826" y="198">فشل تلقائي بعد 30 ث</text>
  <rect class="fn" x="726" y="212" width="200" height="26"/><text class="t" x="826" y="230">استبعاد الانشغال</text>

  <!-- 语聊房 -->
  <rect class="mod" x="130" y="290" width="320" height="40"/>
  <text class="tm" x="290" y="315">غرفة صوتية</text>
  <path class="edge" d="M 480 60 L 290 290"/>
  <rect class="fn" x="130" y="342" width="320" height="26"/><text class="t" x="290" y="360">إنشاء / انضمام / مغادرة / حل · 8 مقاعد</text>
  <rect class="fn" x="130" y="374" width="320" height="26"/><text class="t" x="290" y="392">mediasoup SFU · إعادة تدوير 5 دقائق</text>

  <!-- 规划中 -->
  <rect class="plan" x="510" y="290" width="320" height="40"/>
  <text class="tm" x="670" y="315">بث / اقتصاد افتراضي (M5)</text>
  <path class="edge" d="M 480 60 L 670 290"/>
  <rect class="plan" x="510" y="342" width="320" height="26"/><text class="t" x="670" y="360">بث مباشر (SRS)</text>
  <rect class="plan" x="510" y="374" width="320" height="26"/><text class="t" x="670" y="392">عملات / إكراميات / هدايا</text>
</svg>
