<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .mod  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; rx: 10 }
    .it   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6 }
    .tm   { font-size: 14px; font-weight: 700; fill: #1e3a8a; text-anchor: middle }
    .t    { font-size: 11.5px; fill: #0f172a; text-anchor: middle }
  </style>

  <!-- 接入层 -->
  <rect class="mod" x="20" y="20" width="920" height="86"/>
  <text class="tm" x="480" y="44">Zugriff · service/config/process.php (Http + WsServer)</text>
  <rect class="it" x="40" y="56" width="440" height="38"/>
  <text class="t" x="260" y="70">HTTP :8788 · X-Api-Version vor Routing</text>
  <text class="t" x="260" y="84" font-size="10" fill="#64748b">Standard v1 · v\d+ prüfen · /api/vX (Http.php)</text>
  <rect class="it" x="500" y="56" width="420" height="38"/>
  <text class="t" x="710" y="70">WS :8789 · Envelope-Frames</text>
  <text class="t" x="710" y="84" font-size="10" fill="#64748b">ActionHandler-Dispatch · ConnectionRegistry uid→fd</text>

  <!-- IM 模块 -->
  <rect class="mod" x="20" y="126" width="440" height="150"/>
  <text class="tm" x="240" y="150">IM-Modul · app/ws + app/im</text>
  <rect class="it" x="40" y="162" width="400" height="30"/>
  <text class="t" x="240" y="181">Deliverer-Push · WsRedis-Status</text>
  <rect class="it" x="40" y="198" width="400" height="30"/>
  <text class="t" x="240" y="217">1v1-Chat / Text / Sprache (type=3)</text>
  <rect class="it" x="40" y="234" width="400" height="30"/>
  <text class="t" x="240" y="253">Sprach-Upload → gRPC Rust VoiceStorage (m4a)</text>

  <!-- 通话模块 -->
  <rect class="mod" x="480" y="126" width="460" height="150"/>
  <text class="tm" x="710" y="150">1v1-Anruf · Rust bee_live (HTTP über gRPC · WS über PHP)</text>
  <rect class="it" x="500" y="162" width="420" height="30"/>
  <text class="t" x="710" y="181">Redis im:call:{id} Zustandsmaschine (HSET)</text>
  <rect class="it" x="500" y="198" width="420" height="30"/>
  <text class="t" x="710" y="217">im:callbusy Besetzt-Sperre (SETNX TTL 300)</text>
  <rect class="it" x="500" y="234" width="420" height="30"/>
  <text class="t" x="710" y="253">30s Timeout · finish-Einmal-Gate (NX+EX 3600)</text>

  <!-- 语聊房模块 -->
  <rect class="mod" x="20" y="296" width="440" height="150"/>
  <text class="tm" x="240" y="320">Voice-Raum · Rust bee_live (HTTP über gRPC · WS über PHP)</text>
  <rect class="it" x="40" y="332" width="400" height="30"/>
  <text class="t" x="240" y="351">DB rooms/room_members Fakten · Redis Online</text>
  <rect class="it" x="40" y="368" width="400" height="30"/>
  <text class="t" x="240" y="387">8 Plätze · join TOCTOU · close-Broadcast</text>
  <rect class="it" x="40" y="404" width="400" height="30"/>
  <text class="t" x="240" y="423">sfuRelay-Übersetzung · HTTP → SFU</text>

  <!-- SFU 模块 -->
  <rect class="mod" x="480" y="296" width="460" height="150"/>
  <text class="tm" x="710" y="320">Medien · media/sfu/server.js (mediasoup 3.14)</text>
  <rect class="it" x="500" y="332" width="420" height="30"/>
  <text class="t" x="710" y="351">Ein Router pro Raum · transports/producers/consumers</text>
  <rect class="it" x="500" y="368" width="420" height="30"/>
  <text class="t" x="710" y="387">RTC UDP 10000-10200 · 5min Leerlauf</text>
  <rect class="it" x="500" y="404" width="420" height="30"/>
  <text class="t" x="710" y="423">coturn TURN :3478 · 64KB-Limit</text>

  <!-- 数据与状态 -->
  <rect class="mod" x="20" y="466" width="920" height="76"/>
  <text class="tm" x="480" y="490">State- &amp; Konsistenz-Design</text>
  <rect class="it" x="40" y="502" width="290" height="30"/>
  <text class="t" x="185" y="521">MySQL: Fakten (Nutzer/Beiträge/Räume)</text>
  <rect class="it" x="350" y="502" width="290" height="30"/>
  <text class="t" x="495" y="521">Redis: Session / IM / Anruf / Raum</text>
  <rect class="it" x="660" y="502" width="260" height="30"/>
  <text class="t" x="790" y="521">REST-Broadcast No-op (bekannt)</text>
</svg>
