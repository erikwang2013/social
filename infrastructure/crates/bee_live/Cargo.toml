[package]
name = "bee_live"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M6: live/voice state machines + circuit breaker / rate limiter / fallback, ported from PHP service"

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
hmac = "0.12"
sha2 = "0.10"
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
redis = "0.27"
mysql_async = "0.34"
idgen_rs = "0.2"
md5 = "0.7"
getrandom = "0.3"
object_store = { version = "0.11", features = ["aws"] }
