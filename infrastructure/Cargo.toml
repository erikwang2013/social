[workspace]
resolver = "2"
members = [
    "crates/bee_config",
    "crates/bee_config_macro",
    "crates/bee_logs",
    "crates/bee_cache",
    "crates/bee_template",
    "crates/bee_kv",
    "crates/bee_search",
    "crates/bee_graph",
    "crates/bee_tsdb",
    "crates/bee_orm",
    "crates/bee_orm_macro",
    "crates/bee_session",
    "crates/bee_router",
    "crates/bee_cli",
    "crates/bee_rust",
    "crates/social_grpc",
    "examples/hello",
]

[workspace.package]
version = "1.0.6"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/erikwang2013/bee-rust"
description = "A production-grade web framework for Rust, inspired by Go's Beego"
keywords = ["web", "framework", "beego", "mvc", "orm"]
categories = ["web-programming"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
security-rust = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
