[workspace]
resolver = "2"
members = [
    "crates/social_grpc",
    "crates/bee_live",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/erikwang2013/bee-rust"
description = "A production-grade web framework for Rust, inspired by Go's Beego"
keywords = ["web", "framework", "beego", "mvc", "orm"]
categories = ["web-programming"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
security-rust = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
