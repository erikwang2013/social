services:
  sfu:
    build: .
    # /signal 无鉴权：8790 仅绑回环，供本机 PHP 调用，禁止外部直连
    ports: ["127.0.0.1:8790:8790", "10000-10200:10000-10200/udp"]
    environment:
      SFU_PORT: "8790"
      SFU_LISTEN_IP: "0.0.0.0"
    restart: unless-stopped
  coturn:
    image: coturn/coturn:4.6
    # TURN_SECRET 必须由环境提供（install.sh 写入 media/sfu/.env），缺失时 compose 直接失败；
    # 凭证由 service 的 GET /api/v1/voice/turn-credentials 按 TURN REST 规范临时签发
    command: ["-c", "/etc/turnserver.conf", "--use-auth-secret", "--static-auth-secret=${TURN_SECRET:?TURN_SECRET is required}"]
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
    ports: ["3478:3478/udp", "3478:3478", "49152-49200:49152-49200/udp"]
    restart: unless-stopped
