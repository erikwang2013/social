<!-- Geist 简化标记：仅头 + 耳机，用于 16–32px favicon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" role="img" aria-labelledby="markTitle">
  <title id="markTitle">Geist</title>
  <style>
    .bg    { fill: #2563eb }
    .head  { fill: #ffffff; stroke: #0f172a; stroke-width: 3 }
    .disc  { fill: #ffffff; stroke: #0f172a; stroke-width: 3.2 }
    .pupil { fill: #0f172a }
    .beak  { fill: #d97706; stroke: #0f172a; stroke-width: 2.2; stroke-linejoin: round }
    .band  { fill: none; stroke: #0f172a; stroke-width: 4; stroke-linecap: round }
    .cup   { fill: #0f172a }
  </style>

  <rect class="bg" x="2" y="2" width="60" height="60" rx="14"/>
  <path class="band" d="M 13 30 C 13 5 51 5 51 30"/>
  <rect class="cup" x="5" y="24" width="10" height="21" rx="5"/>
  <rect class="cup" x="49" y="24" width="10" height="21" rx="5"/>
  <circle class="head" cx="32" cy="36" r="22"/>
  <circle class="disc" cx="25" cy="35" r="8.5"/>
  <circle class="disc" cx="39" cy="35" r="8.5"/>
  <circle class="pupil" cx="25" cy="35" r="3.6"/>
  <circle class="pupil" cx="39" cy="35" r="3.6"/>
  <path class="beak" d="M 29 42 L 35 42 L 32 48.5 Z"/>
</svg>
