<!-- Geist 简化标记：仅头 + 耳机，用于 16–32px favicon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" role="img" aria-labelledby="markTitle">
  <title id="markTitle">Geist</title>
  <style>
    .bg    { fill: #2563eb }
